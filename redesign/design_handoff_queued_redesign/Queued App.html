<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Queued</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background:
      radial-gradient(120% 60% at 50% 120%, rgba(45,212,143,0.10), transparent 65%),
      linear-gradient(165deg, #02100B 0%, #081F14 60%, #0B2E1E 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
  }
  * { box-sizing: border-box; }
  #root { display: flex; align-items: center; justify-content: center; min-height: 100dvh; width: 100%; }
  .phone-wrap {
    width: 402px; height: 862px;
    transform-origin: center center;
  }
  @media (max-height: 900px)  { .phone-wrap { transform: scale(0.92); } }
  @media (max-height: 820px)  { .phone-wrap { transform: scale(0.84); } }
  @media (max-height: 740px)  { .phone-wrap { transform: scale(0.76); } }
  @media (max-height: 660px)  { .phone-wrap { transform: scale(0.68); } }
  @media (max-width:  420px)  { .phone-wrap { transform: scale(0.90); } }

  @keyframes qFade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes qUp   { from { transform: translateY(100%) } to { transform: translateY(0) } }
  .dc-card * { scrollbar-width: none; }
  .dc-card *::-webkit-scrollbar { display: none; }
  /* hide scrollbars everywhere inside the phone */
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  * { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="app-data.jsx"></script>
<script type="text/babel" src="app-sheets.jsx"></script>
<script type="text/babel" src="screen-profile.jsx"></script>
<script type="text/babel" src="screen-friends.jsx"></script>
<script type="text/babel" src="screen-discover.jsx"></script>
<script type="text/babel" src="screen-shared.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function App() {
  /* ── navigation ── */
  const [screen, setScreen] = useState('profile');
  const [listFriend, setListFriend] = useState(null);
  const [recommendOpen, setRecommendOpen] = useState(false);
  const [appToast, setAppToast] = useState('');

  function flashApp(msg) { setAppToast(msg); setTimeout(() => setAppToast(''), 2200); }
  function nav(id) {
    if (id === 'recommend') { setRecommendOpen(true); return; }
    const s = (id === 'discover2') ? 'discover' : id;
    setScreen(s);
    if (s !== 'shared') setListFriend(null);
  }
  const activeNav = screen === 'discover' ? 'discover' : (screen === 'friends' || screen === 'shared') ? 'friends' : 'profile';

  /* ── queue store ── */
  const [queue, setQueue] = useState([...DATA]);
  const queueRef = useRef(queue);
  useEffect(() => { queueRef.current = queue; }, [queue]);

  function addToQueue(item) {
    setQueue(prev => prev.find(i => i.id === item.id) ? prev : [item, ...prev]);
  }
  function setStatus(id, status) {
    setQueue(prev => prev.map(i => i.id === id ? { ...i, status } : i));
  }
  function setRating(id, rating, review) {
    setQueue(prev => prev.map(i => i.id === id ? { ...i, rating, review, status: 'finished' } : i));
  }

  /* ── bot ── */
  const [botThinking, setBotThinking] = useState(false);
  const [botRec, setBotRec] = useState(null);
  const [botReason, setBotReason] = useState('');
  const [botPickIdx, setBotPickIdx] = useState(0);

  const botActive = !!queueRef.current.find(i => i.origin?.type === 'bot' && ACTIVE_STATUSES.includes(i.status));
  const liveBotRec = queue.find(i => i.origin?.type === 'bot' && ACTIVE_STATUSES.includes(i.status)) || botRec;

  function askBot() {
    if (botThinking) return;
    setBotThinking(true);
    setTimeout(() => {
      const current = queueRef.current;
      const active = current.find(i => i.origin?.type === 'bot' && ACTIVE_STATUSES.includes(i.status));
      if (active) {
        setBotRec(active);
        setBotReason('');
      } else {
        const pick = BOT_PICKS[botPickIdx % BOT_PICKS.length];
        setBotPickIdx(idx => idx + 1);
        const newItem = {
          ...pick, status: 'not_yet_viewed',
          origin: { type: 'bot' },
        };
        setQueue(prev => [newItem, ...prev]);
        setBotRec(newItem);
        setBotReason(pick.reason);
      }
      setBotThinking(false);
    }, 1700);
  }
  function dismissBotReason() { setBotReason(''); }

  const store = {
    queue, addToQueue, setStatus, setRating,
    botThinking,
    botActive: !!queue.find(i => i.origin?.type === 'bot' && ACTIVE_STATUSES.includes(i.status)),
    botRec: liveBotRec,
    botReason,
    askBot,
    dismissBotReason,
  };

  return (
    <div className="phone-wrap">
      <IOSDevice width={402} height={862} dark>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', position: 'relative' }}>

          {/* screens */}
          <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
            {screen === 'profile' && <ProfileScreen store={store} />}
            {screen === 'friends' && (
              <FriendsScreen onViewList={(f) => { setListFriend(f); setScreen('shared'); }} />
            )}
            {screen === 'shared' && listFriend && (
              <SharedListScreen friend={listFriend} onBack={() => setScreen('friends')} />
            )}
            {screen === 'discover' && <DiscoverScreen store={store} />}
          </div>

          {/* nav */}
          <AppBottomNav active={activeNav} onNav={nav} />
        </div>

        {/* recommend sheet + app toast render inside device */}
        <RecommendSheet
          open={recommendOpen}
          onClose={() => setRecommendOpen(false)}
          onSend={(friend, item) => {
            setRecommendOpen(false);
            if (friend && item) flashApp(`"${item.title}" sent to ${friend.name.split(' ')[0]} ✓`);
          }}
        />

        {appToast && (
          <div style={{
            position: 'absolute', bottom: 112, left: 18, right: 18, zIndex: 100,
            background: 'rgba(8,48,33,0.97)', border: '1px solid rgba(150,214,180,0.20)',
            borderRadius: 14, padding: '12px 16px',
            fontFamily: "'Plus Jakarta Sans', sans-serif", fontSize: 13.5, fontWeight: 700,
            color: '#F7F1E4', textAlign: 'center',
            backdropFilter: 'blur(12px)', boxShadow: '0 14px 30px rgba(0,0,0,0.4)',
            animation: 'qFade .2s ease',
          }}>{appToast}</div>
        )}
      </IOSDevice>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
